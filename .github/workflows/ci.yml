name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Throwaway CI database: these are not secrets. The test guard requires a database
      # whose name ends in _test and differs from DATABASE_URL.
      DATABASE_URL: postgresql://relay:relay@localhost:5432/relay
      TEST_DATABASE_URL: postgresql://relay:relay@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Create the test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE relay_test'
      - run: npm ci
      - run: npm run typecheck
      - name: Server tests (real PostgreSQL)
        run: npm test -w server
      - name: Mock consumer tests
        run: npm test -w mock-consumer
      - name: Dashboard tests
        run: npm test -w dashboard
      - name: Dashboard production build
        run: npm run build -w dashboard
      - name: Server production build
        run: npm run build -w server

  docker:
    # Docker does not run on the development machine (PROGRESS D10), so the images, the
    # compose file and the whole stack are validated here: build, start, run the end-to-end
    # demo inside the stack, and smoke-test the dashboard's nginx (static files, API proxy,
    # security headers).
    name: Docker stack + end-to-end demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose --profile demo build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 180 api worker mock-consumer dashboard
      - name: Run the end-to-end demo inside the stack
        run: docker compose --profile demo run --rm demo
      - name: Smoke-test the dashboard container
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/healthz | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/messages/anything | grep -q '<div id="root">'   # SPA fallback
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/endpoints)" = 401
          ! curl -s http://localhost:8080/metrics | grep -q relay_deliveries                 # not forwarded
          curl -fsS http://localhost:3000/metrics | grep -q '^relay_deliveries{status="dead"}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose --profile demo down -v
